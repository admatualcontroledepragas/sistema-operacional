<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atual Saúde Ambiental - Portal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14234c">

    <!-- Ícones da Aplicação (Logo Local) -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Layout de Fundo Dividido */
        body { 
            background-color: #14234c; /* Azul exato da Logo */
            color: #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        /* LOGO NO TOPO */
        .logo-container {
            width: 100%;
            height: 35vh; /* Ocupa 35% da tela */
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .logo-container img {
            width: 140px; 
            height: auto;
        }

        /* CARTÃO BRANCO PRINCIPAL (Expande até ao fundo) */
        .login-card {
            background-color: white;
            width: 100%;
            flex-grow: 1; /* Preenche todo o resto da tela para não aparecer azul em baixo */
            border-radius: 60px 0 0 0; /* Canto superior esquerdo arredondado */
            padding: 40px 30px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* TELA DE LOGIN */
        #tela-login { 
            width: 100%; 
            max-width: 320px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            flex-grow: 1; /* Força o rodapé a ir para o fundo */
        }

        /* TEXTOS DO TÍTULO */
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #14234c; font-size: 32px; font-weight: 900; letter-spacing: 1px; margin-bottom: 2px; }
        .header p { color: #888; font-size: 15px; font-weight: 500; }

        /* FORMULÁRIO E CAMPOS */
        form { width: 100%; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            color: #888;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 5px;
            margin-left: 10px;
        }

        /* Contentor relativo para centralizar o olho na vertical */
        .form-group-input {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Input Estilo Pílula */
        .input-login { 
            width: 100%; 
            padding: 16px 45px 16px 20px; /* Padding direito maior para não escrever por cima do olho */
            background-color: #e5e7eb; 
            border: none; 
            border-radius: 25px; 
            font-size: 15px; 
            color: #333;
            outline: none; 
            transition: 0.2s;
        }
        .input-login:focus { background-color: #d1d5db; }
        .input-login::placeholder { color: #6b7280; }

        /* Olhinho da Senha */
        .btn-toggle-senha {
            position: absolute;
            right: 15px;
            background: transparent;
            border: none;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }

        /* BOTÃO ENTRAR */
        .btn-login { 
            background-color: #14234c; 
            color: white; 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 25px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-login:disabled { background-color: #6b7280; cursor: not-allowed; }

        /* SPINNER DE CARREGAMENTO */
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite; vertical-align: middle; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* RODAPÉ SITE */
        .footer-site {
            margin-top: auto; /* Empurra o rodapé para o fundo do ecrã */
            color: #9ca3af;
            font-size: 12px;
            text-align: center;
            padding-bottom: 10px;
            width: 100%;
        }

        /* ------------------------------------------- */
        /* MENU DE SISTEMAS (MOSTRADO APÓS LOGIN)      */
        /* ------------------------------------------- */
        #menu-sistemas { 
            display: none; 
            width: 100%; 
            max-width: 350px; 
            flex-direction: column; 
            align-items: center;
            margin-top: 10px;
        }
        .bem-vindo { text-align: center; margin-bottom: 25px; font-weight: 700; color: #14234c; font-size: 20px; }
        
        .menu-card {
            background: white; border-radius: 16px; padding: 15px 20px; display: flex; align-items: center; gap: 15px;
            text-decoration: none; color: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.06); transition: transform 0.2s;
            border: 1px solid #f3f4f6;
            width: 100%;
            margin-bottom: 15px;
        }
        .menu-card:active { transform: scale(0.98); }
        .menu-card .icon { background: #14234c; padding: 12px; border-radius: 12px; color: white; display: flex; }
        .menu-card .info h3 { font-size: 15px; margin-bottom: 2px; color: #14234c; }
        .menu-card .info p { font-size: 11px; color: #6b7280; }
        
        .btn-sair { margin-top: 20px; text-align: center; color: #dc2626; font-weight: bold; cursor: pointer; padding: 10px; font-size: 15px; }

    </style>
</head>
<body>

    <!-- LOGO NO TOPO AZUL -->
    <div class="logo-container" id="area-logo">
        <img src="logo.png" alt="Logo Atual">
    </div>

    <!-- CARTÃO BRANCO (Fundo) -->
    <div class="login-card">
        
        <!-- ÁREA DE LOGIN -->
        <div id="tela-login">
            <div class="header">
                <h1>ATUAL</h1>
                <p>Saúde Ambiental</p>
            </div>

            <form onsubmit="fazerLogin(event)">
                <div class="form-group">
                    <label>NOME</label>
                    <div class="form-group-input">
                        <!-- Adicionado: autocomplete="username" -->
                        <input type="text" id="loginUser" class="input-login" placeholder="Nome" autocomplete="username" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>SENHA</label>
                    <div class="form-group-input">
                        <!-- Adicionado: autocomplete="current-password" -->
                        <input type="password" id="loginPass" class="input-login" placeholder="******" autocomplete="current-password" required>
                        <!-- Botão Olhinho alinhado na vertical -->
                        <button type="button" class="btn-toggle-senha" onclick="toggleSenha()">
                            <span class="material-icons" id="icone-olho">visibility</span>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="btn-login">Entrar</button>
            </form>

            <div class="footer-site">www.atualsaudeambiental.com.br</div>
        </div>

        <!-- ÁREA DOS SISTEMAS -->
        <div id="menu-sistemas">
            <div class="bem-vindo" id="msg-bemvindo"></div>

            <a href="comunicados/index.html" class="menu-card">
                <div class="icon"><span class="material-icons">campaign</span></div>
                <div class="info"><h3>Comunicados</h3><p>Dedetização, Limpeza e Termo</p></div>
            </a>

            <a href="relatorios/index.html" class="menu-card">
                <div class="icon"><span class="material-icons">assignment_turned_in</span></div>
                <div class="info"><h3>Relatórios e Certificados</h3><p>Gestão de Serviços e Garantias</p></div>
            </a>
            
            <div class="btn-sair" onclick="sair()">Sair do Portal</div>
        </div>
    </div>

    <script>
        // FUNÇÃO DO OLHINHO DA SENHA
        function toggleSenha() {
            const inputSenha = document.getElementById('loginPass');
            const iconeOlho = document.getElementById('icone-olho');
            
            if (inputSenha.type === 'password') {
                inputSenha.type = 'text';
                iconeOlho.innerText = 'visibility_off'; 
            } else {
                inputSenha.type = 'password';
                iconeOlho.innerText = 'visibility'; 
            }
        }

        // COLOQUE AQUI A URL DO NOVO SCRIPT (O COFRE CENTRAL)
        const URL_API_LOGIN = "https://script.google.com/macros/s/AKfycbwxCNM7-XWJm2btht000tgZ343KsmCfwFG4gXmCCp8e-48nPDdS3Qw9gfvkJGWGu6ym/exec";
        
        // Verifica ao abrir se já está logado
        window.onload = function() {
            if (sessionStorage.getItem("sessaoAtiva") === "true") {
                liberarPortal(sessionStorage.getItem("nomeUsuario"));
            }
        };

        async function fazerLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            
            // Adiciona o SPINNER de carregamento
            btn.innerHTML = '<div class="spinner"></div> Verificando...'; 
            btn.disabled = true;

            const payload = {
                acao: "login",
                usuario: document.getElementById('loginUser').value,
                senha: document.getElementById('loginPass').value
            };

            try {
                const req = await fetch(URL_API_LOGIN, { method: 'POST', body: JSON.stringify(payload) });
                const res = await req.json();

                if (res.sucesso) {
                    sessionStorage.setItem("sessaoAtiva", "true");
                    sessionStorage.setItem("nomeUsuario", res.nome);
                    liberarPortal(res.nome);
                } else {
                    alert(res.mensagem);
                }
            } catch (erro) {
                alert("Erro de conexão com o servidor de acessos.");
            }
            
            // Restaura o botão original após carregar
            btn.innerHTML = "Entrar"; 
            btn.disabled = false;
        }

        function liberarPortal(nome) {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('menu-sistemas').style.display = 'flex';
            document.getElementById('msg-bemvindo').innerText = "Olá, " + nome;
        }

        function sair() {
            sessionStorage.clear();
            document.getElementById('menu-sistemas').style.display = 'none';
            
            document.getElementById('area-logo').style.display = 'flex';
            document.getElementById('tela-login').style.display = 'flex';
            document.getElementById('loginPass').value = "";
        }

        // Registo do PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
