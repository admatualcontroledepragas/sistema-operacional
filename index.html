<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atual Saúde Ambiental - Portal</title>
    
    <!-- Link para transformar em App -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#021f59">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f4f8; color: #333; display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        
        .header { text-align: center; margin-top: 30px; margin-bottom: 40px; }
        .header h1 { color: #021f59; font-size: 24px; font-weight: 800; text-transform: uppercase; }
        .header p { color: #666; font-size: 14px; margin-top: 5px; }

        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; width: 100%; max-width: 400px; }
        
        .menu-card {
            background: white; border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 15px;
            text-decoration: none; color: #333; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s, box-shadow 0.2s;
            border-left: 5px solid #004481;
        }
        .menu-card:active { transform: scale(0.98); }
        .menu-card .icon { background: #e9ecef; padding: 12px; border-radius: 50%; color: #004481; display: flex; }
        .menu-card .info h3 { font-size: 16px; margin-bottom: 3px; }
        .menu-card .info p { font-size: 12px; color: #777; }
    </style>
</head>
<body>

    <div class="header">
        <h1>PORTAL OPERACIONAL</h1>
        <p>Atual Saúde Ambiental</p>
    </div>

    <div class="menu-grid">
        <!-- Link para a pasta comunicados -->
        <a href="comunicados/index.html" class="menu-card">
            <div class="icon"><span class="material-icons">campaign</span></div>
            <div class="info">
                <h3>Comunicados</h3>
                <p>Dedetização, Limpeza e Termo</p>
            </div>
        </a>

        <!-- Link para a pasta relatorios -->
        <a href="relatorios/index.html" class="menu-card">
            <div class="icon"><span class="material-icons">assignment_turned_in</span></div>
            <div class="info">
                <h3>Relatórios e Certificados</h3>
                <p>Gestão de Serviços e Garantias</p>
            </div>
        </a>
    </div>

    <!-- Script para registrar o Service Worker (Obrigatório para PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Service Worker registrado com sucesso!');
                }).catch(err => {
                    console.log('Falha ao registrar o Service Worker', err);
                });
            });
        }
    </script>
</body>
</html>
